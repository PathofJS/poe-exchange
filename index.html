<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Path of Exile Currency Exchange</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext x='1' y='13' font-family='system-ui' font-size='12' fill='%23ffffff'%3EXE%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: dark;
      color: #e3e8ee;
      background: #08101b;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }

    .page {
      max-width: 1080px;
      margin: 0 auto;
      display: grid;
      gap: 24px;
    }

    h1, h2, h3 {
      margin: 0;
      color: #f5f9ff;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 3rem);
    }

    p {
      line-height: 1.7;
      color: #cbd5e1;
    }

    .card {
      background: rgba(20, 32, 48, 0.92);
      border: 1px solid rgba(150, 180, 210, 0.12);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .endpoint-list {
      display: grid;
      gap: 16px;
    }

    .endpoint-item {
      background: rgba(8, 19, 31, 0.9);
      border: 1px solid rgba(115, 160, 220, 0.15);
      border-radius: 14px;
      padding: 16px;
    }

    .endpoint-item code,
    .note code {
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 6px;
      border-radius: 6px;
      color: #a8d1ff;
      font-size: 0.95em;
    }

    .endpoint-item strong {
      display: block;
      margin-bottom: 8px;
      color: #fff;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 12px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: #d2dcea;
      font-size: 0.95rem;
    }

    input,
    select {
      width: 100%;
      min-width: 180px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(115, 160, 220, 0.16);
      background: rgba(12, 25, 38, 0.96);
      color: #edf2f7;
      font-size: 0.95rem;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      color: #0b1120;
      background: linear-gradient(135deg, #7df5ff 0%, #5f76ff 100%);
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
      font-weight: 600;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 24px rgba(96, 168, 255, 0.18);
    }

    .output {
      margin-top: 18px;
      background: #04111d;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      max-height: 260px;
      overflow: auto;
      padding: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }

    .summary {
      display: grid;
      gap: 10px;
    }

    .method-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .method-list li {
      background: rgba(255, 255, 255, 0.04);
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: rgba(125, 248, 207, 0.18);
      color: #aaf7de;
      padding: 3px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .note {
      color: #a4bacc;
      margin-top: 14px;
    }

    .scroll-table {
      overflow-x: auto;
      max-height: 62vh;
      margin-top: 16px;
      position: relative;
    }

    .market-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 640px;
      margin-top: 12px;
    }

    .market-table th,
    .market-table td {
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: left;
      vertical-align: top;
    }

    .market-table thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: rgba(6, 17, 29, 0.98);
      color: #e8f4ff;
      backdrop-filter: blur(6px);
    }

    .market-table th {
      background: rgba(6, 17, 29, 0.95);
      color: #e8f4ff;
    }

    .market-table td {
      color: #d9e3ef;
    }

    .market-table td code {
      white-space: pre-wrap;
    }

    .market-table td ul {
      margin: 0;
      padding-left: 18px;
      list-style: disc;
    }

    .pair-metrics {
      margin: 0;
      padding-left: 20px;
    }

    .pair-metrics li {
      color: #d9e3ef;
      margin-bottom: 8px;
    }

    .empty-cell {
      color: #879aae;
    }

    .tab-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab-button {
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      color: #d9e3ef;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    .tab-button:hover {
      transform: translateY(-1px);
      border-color: rgba(125, 245, 255, 0.4);
    }

    .tab-button.active {
      background: rgba(125, 245, 255, 0.16);
      border-color: #7df5ff;
      color: #fff;
    }



    .list {
      display: grid;
      gap: 16px;
      margin-top: 8px;
    }

    .thumb {
      width: 48px;
      height: 48px;
      background: #08101b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .thumb img {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    .meta {
      font-size: 0.65rem;
      line-height: 1.1;
      opacity: 0;
      max-width: 120px;
      text-align: center;
      transition: opacity 0.15s ease;
      pointer-events: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item:hover .meta {
      opacity: 1;
    }

    .name {
      font-weight: 600;
      color: #e8f4ff;
    }

    .id {
      color: #8aa2c0;
      font-size: 12px;
      word-break: break-word;
    }

    .group-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .group-tab-btn {
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: #d9e3ef;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .group-tab-btn:hover {
      border-color: rgba(125, 245, 255, 0.4);
    }

    .group-tab-btn.active {
      background: rgba(125, 245, 255, 0.16);
      border-color: #7df5ff;
      color: #fff;
    }

    .item-group {
      display: none;
      gap: 8px;
    }

    .item-group.active {
      display: grid;
    }

    .item-group-header {
      font-size: 0.82rem;
      font-weight: 700;
      color: #a8caff;
      margin-bottom: 4px;
    }

    .item-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .item {
      width: 44px;
      min-width: 44px;
      height: 44px;
      padding: 4px;
      border-radius: 10px;
      border: 2px solid transparent;
      background: rgba(255, 255, 255, 0.05);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
    }

    .item.selected {
      border-color: #7df5ff;
      background: rgba(125, 245, 255, 0.12);
    }

    .item:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.12);
    }

    .item .thumb {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <main class="page">



    </section>

    <section class="card">
      <h2>Live fetch controls</h2>
      <p style="margin: 0 0 12px 0; color: #cbd5e1; font-size: 0.95rem;">Select the realm and optional history ID, then fetch current exchange markets.</p>
      <div class="controls" style="gap: 8px; margin-bottom: 8px;">
        <label style="gap: 3px; min-width: auto;">
          Realm
          <select id="realmSelect" style="min-width: 80px;">
            <option value="">pc</option>
            <option value="xbox">xbox</option>
            <option value="sony">sony</option>
            <option value="poe2">poe2</option>
          </select>
        </label>
        <label style="gap: 3px; min-width: auto; flex: 1;">
          League
          <input id="leagueFilterInput" type="text" placeholder="filter" style="min-width: 140px;" />
        </label>
        <label style="gap: 3px; min-width: auto;">
          Hours ago
          <select id="hourSelect" style="min-width: 120px;"></select>
        </label>
        <input id="idInput" type="hidden" />
        <button id="fetchButton" style="padding: 10px 16px; margin-top: 0;">Fetch</button>
      </div>
      <div class="output" id="outputBlock" style="margin: 8px 0; min-height: 60px;">Click fetch to load data...</div>
    </section>

    <section class="card" id="itemFilterCard">
      <h2>Currency Item Filter</h2>
      <div class="note" style="margin-bottom: 8px;">Select currencies from the fetched data.</div>

      <div class="controls" style="margin-bottom: 6px;">
        <input id="search" placeholder="Search..." style="flex:1;padding:6px;" />
        <button id="prefetch" style="padding: 8px 12px; font-size: 0.85rem;">Prefetch</button>
      </div>

      <div id="count" style="margin-bottom: 6px; color: #8aa2c0; font-size: 0.9rem;"></div>
      <div id="groupTabs" class="group-tabs"></div>
      <div id="list" class="list" style="margin-top: 6px;"></div>
    </section>

    <section class="card" id="filteredResultsCard" style="display:none;">
        <h3>League Results</h3>
        <div id="leagueTabs" class="tab-bar"></div>
        <div class="note" id="filteredNote"></div>
<div class="scroll-table">
          <table class="market-table" id="filteredTable">
            <thead>
              <tr>
                <th>Listing</th>
                <th>Price</th>
                <th>Volume Traded</th>
                <th>Lowest Stock</th>
                <th>Highest Stock</th>
                <th>Lowest Ratio</th>
                <th>Highest Ratio</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>


  </main>

  <script>
    const output = document.getElementById('outputBlock');
    const realmSelect = document.getElementById('realmSelect');
    const leagueFilterInput = document.getElementById('leagueFilterInput');
    const hourSelect = document.getElementById('hourSelect');
    const idInput = document.getElementById('idInput');
    const fetchButton = document.getElementById('fetchButton');

    const baseUrl = 'https://web.poecdn.com/api/currency-exchange';
    const localProxyBase = 'https://faustus.poe-currency-exchange.workers.dev/proxy?url=';
    const publicProxyBase = 'https://api.allorigins.win/raw?url=';

    function getCurrentHourBucket() {
      return Math.floor(Date.now() / 1000 / 3600) * 3600;
    }

    function buildHourOptions() {
      const currentHour = getCurrentHourBucket();
      const options = [];

      for (let offset = 1; offset <= 12; offset += 1) {
        const value = currentHour - (offset * 3600);
        const date = new Date(value * 1000);
        const label = `${offset} hour${offset === 1 ? '' : 's'} ago (${date.toISOString().slice(0, 10)} ${date.toISOString().slice(11, 13)}:00 UTC)`;
        options.push(`<option value="${value}">${label}</option>`);
      }

      hourSelect.innerHTML = options.join('');
      const firstValue = currentHour - (1 * 3600);
      idInput.value = String(firstValue);
      hourSelect.value = String(firstValue);
    }

    hourSelect.addEventListener('change', () => {
      idInput.value = String(hourSelect.value);
    });

    buildHourOptions();

    const listEl = document.getElementById('list');
    const searchEl = document.getElementById('search');
    const countEl = document.getElementById('count');
    const groupTabsEl = document.getElementById('groupTabs');
    const prefetchBtn = document.getElementById('prefetch');
    let visualIdentityMap = new Map();
    let currentGroupTab = null;

    async function loadItems() {
      const candidates = ['baseitemtypes.json', './baseitemtypes.json', '../baseitemtypes.json'];
      let lastErr = null;
      for (const path of candidates) {
        try {
          const res = await fetch(path);
          if (!res.ok) throw new Error('Failed to load JSON: ' + res.status);
          return res.json();
        } catch (e) {
          lastErr = e;
        }
      }
      throw lastErr || new Error('No path resolved for baseitemtypes.json');
    }

    async function loadVisualIdentityMap() {
      const candidates = ['itemvisualidentity.json', './itemvisualidentity.json', '../itemvisualidentity.json'];
      let lastErr = null;
      for (const path of candidates) {
        try {
          const res = await fetch(path);
          if (!res.ok) throw new Error('Failed to load visual identity JSON: ' + res.status);
          const items = await res.json();
          const map = new Map();
          if (Array.isArray(items)) {
            items.forEach((entry, index) => {
              if (entry && typeof entry.DDSFile === 'string') {
                map.set(index, entry.DDSFile);
              }
            });
          }
          return map;
        } catch (e) {
          lastErr = e;
        }
      }
      console.warn('Unable to load itemvisualidentity.json, using fallback icon mapping.', lastErr);
      return new Map();
    }

    function imageUrlForItem(item) {
      const visualId = item && typeof item.ItemVisualIdentity === 'number' ? item.ItemVisualIdentity : null;
      if (visualId !== null && visualIdentityMap.has(visualId)) {
        const filePath = visualIdentityMap.get(visualId).replace(/^\/+/, '').replace(/\\/g, '/').toLowerCase();
        return `https://image.ggpk.exposed/${filePath}?format=png`;
      }

      const id = item && item.Id ? item.Id : '';
      const parts = id.split('/');
      const last = parts[parts.length - 1] || id;
      return `https://image.ggpk.exposed/art/2ditems/currency/${last.toLowerCase()}.dds?format=png`;
    }

    function setCount(n, total) {
      countEl.textContent = `${n} visible / ${total} total`;
    }

    function toDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function fetchAndCache(url) {
      try {
        const cached = sessionStorage.getItem(url);
        if (cached) return cached;
        const r = await fetch(url);
        if (!r.ok) throw new Error('img fetch failed');
        const blob = await r.blob();
        const dataUrl = await toDataUrl(blob);
        try { sessionStorage.setItem(url, dataUrl); } catch (e) { /* ignore storage full */ }
        return dataUrl;
      } catch (e) {
        return null;
      }
    }

    function createItemNode(item) {
      const id = item.Id;
      const name = item.Name || id;
      const url = imageUrlForItem(item);

      const wrap = document.createElement('div');
      wrap.className = 'item';
      wrap.title = name;
      wrap.dataset.id = id;
      wrap.dataset.name = name.toLowerCase();
      wrap.dataset.imageUrl = url;

      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      const img = document.createElement('img');
      img.alt = name;
      thumb.appendChild(img);

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = name;

      wrap.appendChild(thumb);
      wrap.appendChild(meta);

      (async () => {
        const data = await fetchAndCache(url);
        if (data) img.src = data;
      })();

      wrap.addEventListener('click', () => selectItem(wrap));
      return wrap;
    }

    function dispatchSelection() {
      const selected = Array.from(document.querySelectorAll('#list .item.selected')).map(i => i.dataset.id);
      const ev = new CustomEvent('itemsSelected', { detail: selected });
      window.dispatchEvent(ev);
    }

    function selectItem(itemEl) {
      document.querySelectorAll('#list .item.selected').forEach((el) => el.classList.remove('selected'));
      itemEl.classList.add('selected');
      dispatchSelection();
    }

    function applySearch(q) {
      const groups = Array.from(listEl.querySelectorAll('.item-group'));
      let visible = 0;
      let total = 0;

      groups.forEach((group) => {
        let groupVisible = 0;
        group.querySelectorAll('.item').forEach((item) => {
          const txt = `${item.dataset.name} ${item.dataset.id}`;
          const ok = !q || txt.indexOf(q) !== -1;
          item.style.display = ok ? 'flex' : 'none';
          if (ok) {
            visible += 1;
            groupVisible += 1;
          }
          total += 1;
        });
        group.style.display = groupVisible ? '' : 'none';
      });

      setCount(visible, total);
    }


    prefetchBtn.addEventListener('click', async () => {
      prefetchBtn.disabled = true;
      const urls = Array.from(document.querySelectorAll('#list .item'))
        .map(item => item.dataset.imageUrl)
        .filter(Boolean);
      for (const u of urls) { await fetchAndCache(u); }
      prefetchBtn.disabled = false;
      alert('Prefetch complete (cached to session)');
    });

    searchEl.addEventListener('input', () => applySearch(searchEl.value.trim().toLowerCase()));

    window.getSelectedItemIds = () => {
      const selected = document.querySelector('#list .item.selected');
      return selected ? [selected.dataset.id] : [];
    };

    function buildGroupKey(item) {
      if (Array.isArray(item.TagsKeys) && item.TagsKeys.length > 0) {
        return String(item.TagsKeys[0]);
      }
      return 'ungrouped';
    }

    let cachedAllItems = null;
    let cachedVisualMap = null;

    async function loadItemsAndVisuals() {
      if (!cachedAllItems || !cachedVisualMap) {
        const [items, visualMap] = await Promise.all([loadItems(), loadVisualIdentityMap()]);
        cachedAllItems = items.filter(it => it.Id && it.Id.indexOf('/Currency/') !== -1);
        cachedVisualMap = visualMap;
        visualIdentityMap = visualMap;
      }
      return [cachedAllItems, cachedVisualMap];
    }

    function switchGroupTab(groupKey) {
      currentGroupTab = groupKey;
      document.querySelectorAll('.item-group').forEach((g) => g.classList.remove('active'));
      document.querySelectorAll('.group-tab-btn').forEach((b) => b.classList.remove('active'));
      const activeGroup = document.querySelector(`[data-tag-key=\"${groupKey}\"]`);
      if (activeGroup) activeGroup.classList.add('active');
      const activeBtn = groupTabsEl.querySelector(`[data-group=\"${groupKey}\"]`);
      if (activeBtn) activeBtn.classList.add('active');
    }

    function initItemFilter(markets, allItems, visualMap) {
      try {
        if (!Array.isArray(markets) || markets.length === 0) {
          listEl.textContent = 'No market data available.';
          return;
        }

        const currencyIds = new Set();
        markets.forEach((market) => {
          if (market && market.market_id) {
            const ids = market.market_id.split('|');
            ids.forEach((id) => currencyIds.add(id.trim()));
          }
        });

        const currency = allItems.filter(
          (it) => it.Id && currencyIds.has(it.Id)
        );

        listEl.innerHTML = '';
        groupTabsEl.innerHTML = '';
        const groups = new Map();
        const groupOrder = [];
        
        currency.forEach((item) => {
          const groupKey = buildGroupKey(item);
          if (!groups.has(groupKey)) {
            groupOrder.push(groupKey);
            const groupRoot = document.createElement('div');
            groupRoot.className = 'item-group';
            groupRoot.dataset.tagKey = groupKey;

            const header = document.createElement('div');
            header.className = 'item-group-header';
            header.textContent = groupKey === 'ungrouped' ? 'Ungrouped' : `Tag ${groupKey}`;

            const row = document.createElement('div');
            row.className = 'item-row';

            groupRoot.appendChild(header);
            groupRoot.appendChild(row);
            groups.set(groupKey, row);
            listEl.appendChild(groupRoot);
          }
          const row = groups.get(groupKey);
          row.appendChild(createItemNode(item));
        });

        groupOrder.forEach((groupKey) => {
          const btn = document.createElement('button');
          btn.className = 'group-tab-btn';
          btn.textContent = groupKey === 'ungrouped' ? 'Ungrouped' : `Tag ${groupKey}`;
          btn.dataset.group = groupKey;
          btn.addEventListener('click', () => switchGroupTab(groupKey));
          groupTabsEl.appendChild(btn);
        });

        if (groupOrder.length > 0) {
          switchGroupTab(groupOrder[0]);
        }

        setCount(currency.length, currencyIds.size);
      } catch (e) {
        listEl.textContent = 'Failed to load items: ' + e.message;
      }
    }

    const currencyNameLookupPromise = fetch('baseitemtypes.json')
      .then((response) => {
        if (!response.ok) {
          throw new Error(`baseitemtypes.json failed: ${response.status} ${response.statusText}`);
        }
        return response.json();
      })
      .then((items) => {
        const lookup = new Map();
        if (Array.isArray(items)) {
          items.forEach((item) => {
            if (item && item.Id && item.Name) {
              lookup.set(item.Id, item.Name);
            }
          });
        }
        return lookup;
      })
      .catch((error) => {
        console.warn('Unable to load baseitemtypes.json, falling back to path-based labels:', error);
        return new Map();
      });

    function buildUrl(realm, id) {
      let url = baseUrl;
      if (realm) {
        url += '/' + encodeURIComponent(realm);
      }
      if (id) {
        url += '/' + encodeURIComponent(id);
      }
      return url;
    }

    async function fetchViaProxy(url, proxyBase) {
      const proxyUrl = proxyBase + encodeURIComponent(url);
      const response = await fetch(proxyUrl, { cache: 'no-store' });
      if (!response.ok) {
        throw new Error(`Proxy request failed: ${response.status} ${response.statusText}`);
      }
      return response.json();
    }

    async function fetchExchangeData(realm, id, leagueFilter) {
      const url = buildUrl(realm, id);
      const currencyNameLookup = await currencyNameLookupPromise;
      output.textContent = `Fetching via Cloudflare Worker proxy...`;

      try {
        const data = await fetchViaProxy(url, localProxyBase);
        renderResult(data, url + ' (via Cloudflare Worker)', leagueFilter, currencyNameLookup);
        return;
      } catch (localError) {
        output.textContent = `Cloudflare Worker proxy failed: ${localError.message}\nRetrying via public proxy...`;
      }

      try {
        const data = await fetchViaProxy(url, publicProxyBase);
        renderResult(data, url + ' (via public proxy)', leagueFilter, currencyNameLookup);
      } catch (proxyError) {
        output.textContent = `Fetch error: ${proxyError.message}`;
      }
    }

    const filteredResultsCard = document.getElementById('filteredResultsCard');
    const filteredNote = document.getElementById('filteredNote');
    const leagueTabs = document.getElementById('leagueTabs');
    const filteredTable = document.querySelector('#filteredTable');
    const filteredTableBody = filteredTable.querySelector('tbody');
    let currentLeagueTab = null;
    let selectedCurrencies = [];
    let lastCurrencyNameLookup = new Map();
    let lastMarkets = [];

    function collectPositiveFields(value, prefix = '') {
      if (typeof value === 'number') {
        return value > 0 ? [{ path: prefix || 'value', value }] : [];
      }
      if (Array.isArray(value)) {
        return value.flatMap((item, index) =>
          collectPositiveFields(item, `${prefix}${prefix ? '.' : ''}[${index}]`)
        );
      }
      if (value && typeof value === 'object') {
        return Object.entries(value).flatMap(([key, child]) =>
          collectPositiveFields(child, `${prefix ? prefix + '.' : ''}${key}`)
        );
      }
      return [];
    }

    function getLastPathName(path) {
      const parts = path.split('/');
      return parts.length > 0 ? parts[parts.length - 1] : path;
    }

    function prettifyName(name) {
      return name
        .replace(/([a-z])([A-Z])/g, '$1 $2')
        .replace(/_/g, ' ')
        .replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2')
        .replace(/\bMetadata\b|\bItems\b|\bCurrency\b|\bHeist\b|\bPoE\b/g, '')
        .trim()
        .replace(/\s{2,}/g, ' ');
    }

    function readableMarketPair(market_id, currencyNameLookup) {
      if (!market_id) {
        return '';
      }

      return market_id
        .split('|')
        .map((item) => {
          const exactName = currencyNameLookup?.get(item);
          if (exactName) {
            return exactName;
          }
          return prettifyName(getLastPathName(item));
        })
        .join(' ↔ ');
    }

    function formatMetricName(metric) {
      return {
        volume_traded: 'volume traded',
        lowest_stock: 'lowest stock',
        highest_stock: 'highest stock',
        lowest_ratio: 'lowest ratio',
        highest_ratio: 'highest ratio',
      }[metric] || metric.replace(/_/g, ' ');
    }

    function formatPositiveDetail(detail) {
      const parts = detail.path.split('.');
      const metric = parts[0] || detail.path;
      const itemName = parts.length > 1 ? prettifyName(getLastPathName(parts[parts.length - 1])) : '';
      return `${formatMetricName(metric)}${itemName ? ' ' + itemName : ''}: ${detail.value}`;
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function hasPositiveMetricEntries(market) {
      const metricFields = ['volume_traded', 'lowest_stock', 'highest_stock', 'lowest_ratio', 'highest_ratio'];
      return metricFields.some((field) => {
        const metricMap = market?.[field];
        if (!metricMap || typeof metricMap !== 'object') return false;
        return Object.values(metricMap).some((value) => Number(value) > 0);
      });
    }

    function getFilteredMarkets(markets, leagueFilter, currencyNameLookup) {
      if (!Array.isArray(markets)) return [];
      const normalizedFilter = leagueFilter ? leagueFilter.trim().toLowerCase() : '';

      return markets
        .map((market) => {
          if (!market || !market.league || !market.market_id) return null;
          if (currentLeagueTab !== 'All' && market.league !== currentLeagueTab) return null;
          if (normalizedFilter && market.league.toLowerCase() !== normalizedFilter) return null;
          if (!hasPositiveMetricEntries(market)) return null;
          return {
            ...market,
            league: market.league,
            market_id: market.market_id,
            readablePair: readableMarketPair(market.market_id, currencyNameLookup),
          };
        })
        .filter(Boolean);
    }

    function metricDictionaryToHtml(metricMap, metricName, currencyNameLookup) {
      if (!metricMap || typeof metricMap !== 'object') {
        return '<span class="empty-cell">—</span>';
      }

      const positiveLines = [];
      Object.entries(metricMap).forEach(([currencyId, value]) => {
        const numericValue = Number(value);
        if (Number.isFinite(numericValue) && numericValue > 0) {
          const currencyName = currencyNameLookup?.get(currencyId) || prettifyName(getLastPathName(currencyId));
          positiveLines.push(`<li>${escapeHtml(`${metricName} ${currencyName}: ${numericValue}`)}</li>`);
        }
      });

      if (positiveLines.length === 0) {
        return '<span class="empty-cell">—</span>';
      }

      return `<ul class="pair-metrics">${positiveLines.join('')}</ul>`;
    }

    function renderFilteredMarkets(markets, leagueFilter, currencyNameLookup) {
      filteredTableBody.innerHTML = '';

      if (currentLeagueTab === 'All') {
        filteredNote.textContent = 'Select a league to view results.';
        filteredResultsCard.style.display = 'block';
        return;
      }

      let filtered = getFilteredMarkets(markets, leagueFilter, currencyNameLookup);

      // Filter by selected currency if one is selected
      if (selectedCurrencies.length > 0) {
        const selectedCurrencySet = new Set(selectedCurrencies);
        filtered = filtered.filter((item) => {
          const ids = item.market_id.split('|');
          const listingCurrencyId = ids[0];
          const priceCurrencyId = ids[1];
          return selectedCurrencySet.has(listingCurrencyId) || selectedCurrencySet.has(priceCurrencyId);
        });
      }

      if (filtered.length === 0) {
        const filterMsg = selectedCurrencies.length > 0 
          ? `No pairs found for league '${currentLeagueTab}' with selected currency.`
          : `No pairs found for league '${currentLeagueTab}'.`;
        filteredNote.textContent = filterMsg;
        filteredResultsCard.style.display = 'block';
        return;
      }

      filtered.forEach((item) => {
        const ids = item.market_id.split('|');
        const listingCurrencyId = ids[0];
        const priceCurrencyId = ids[1];
        const listingName = currencyNameLookup?.get(listingCurrencyId) || prettifyName(getLastPathName(listingCurrencyId));
        const priceName = currencyNameLookup?.get(priceCurrencyId) || prettifyName(getLastPathName(priceCurrencyId));

        const row = document.createElement('tr');
        row.innerHTML = `
          <td><code>${escapeHtml(listingName)}</code></td>
          <td><code>${escapeHtml(priceName)}</code></td>
          <td>${metricDictionaryToHtml(item?.volume_traded || item?.volume || {}, 'volume traded', currencyNameLookup)}</td>
          <td>${metricDictionaryToHtml(item?.lowest_stock || {}, 'lowest stock', currencyNameLookup)}</td>
          <td>${metricDictionaryToHtml(item?.highest_stock || {}, 'highest stock', currencyNameLookup)}</td>
          <td>${metricDictionaryToHtml(item?.lowest_ratio || {}, 'lowest ratio', currencyNameLookup)}</td>
          <td>${metricDictionaryToHtml(item?.highest_ratio || {}, 'highest ratio', currencyNameLookup)}</td>
        `;
        filteredTableBody.appendChild(row);
      });

      const filterMsg = selectedCurrencies.length > 0
        ? `Showing ${filtered.length} pair(s) for league '${currentLeagueTab}' with selected currency.`
        : `Showing ${filtered.length} pair(s) for league '${currentLeagueTab}' where at least one numeric field is greater than zero.`;
      filteredNote.textContent = filterMsg;
      filteredResultsCard.style.display = 'block';
    }

    function setActiveLeagueTab(tab) {
      currentLeagueTab = tab;
      Array.from(leagueTabs.children).forEach((button) => {
        button.classList.toggle('active', button.dataset.league === tab);
      });
    }

    function renderLeagueTabs(markets) {
      const leagues = Array.from(new Set((Array.isArray(markets) ? markets : []).map((m) => m?.league).filter(Boolean)));
      leagues.sort();
      leagueTabs.innerHTML = '';
      leagues.forEach((league) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'tab-button';
        button.textContent = league;
        button.dataset.league = league;
        button.addEventListener('click', () => {
          setActiveLeagueTab(league);
          renderFilteredMarkets(markets, leagueFilterInput.value, lastCurrencyNameLookup);
        });
        leagueTabs.appendChild(button);
      });
      if (leagues.length > 0) setActiveLeagueTab(leagues[0]);
    }

    function renderResult(data, url, leagueFilter, currencyNameLookup) {
      lastCurrencyNameLookup = currencyNameLookup;
      lastMarkets = data.markets || [];
      const summary = [];
      summary.push(`URL: ${url}`);
      if (data.next_change_id !== undefined) {
        summary.push(`next_change_id: ${data.next_change_id}`);
      }
      if (Array.isArray(data.markets)) {
        summary.push(`markets: ${data.markets.length}`);
      }
      summary.push('');
      summary.push(JSON.stringify(data, null, 2));
      output.textContent = summary.join('\n');

      loadItemsAndVisuals().then(([allItems, visualMap]) => {
        initItemFilter(data.markets, allItems, visualMap);
      });

      renderLeagueTabs(data.markets);
      renderFilteredMarkets(data.markets, leagueFilter, currencyNameLookup);
    }

    window.addEventListener('itemsSelected', (event) => {
      selectedCurrencies = event.detail || [];
      renderFilteredMarkets(lastMarkets, leagueFilterInput.value, lastCurrencyNameLookup);
    });

    fetchButton.addEventListener('click', () => {
      const realm = realmSelect.value;
      const leagueFilter = leagueFilterInput.value;
      const id = idInput.value.trim();
      fetchExchangeData(realm, id, leagueFilter);
    });
  </script>
</body>
